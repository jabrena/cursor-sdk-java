name: Generate Protobuf Documentation

on:
  push:
    branches:
      - main
      - feature/setup
    paths:
      - 'schemas/src/main/proto/**'
  pull_request:
    branches:
      - main
      - feature/setup
    paths:
      - 'schemas/src/main/proto/**'
  workflow_dispatch:

jobs:
  generate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Create docs directory
        run: mkdir -p docs

      - name: Generate Protobuf Documentation
        run: |
          docker run --rm \
            -v "$(pwd)/docs:/out" \
            -v "$(pwd)/schemas/src/main/proto:/protos" \
            pseudomuto/protoc-gen-doc \
            --doc_opt=markdown,docs.md \
            agent.proto

      - name: Setup Git
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Create feature branch and commit
        if: github.event_name == 'push'
        id: create-branch
        run: |
          BRANCH_NAME="docs/update-protobuf-docs-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"
          git add docs/
          if ! git diff --staged --quiet; then
            git commit -m "docs: regenerate protobuf documentation"
            git push -u origin "$BRANCH_NAME"
            echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: github.event_name == 'push' && steps.create-branch.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branchName = '${{ steps.create-branch.outputs.branch_name }}';
            const baseBranch = context.ref.replace('refs/heads/', '');

            if (!branchName) {
              console.log('No branch name found, skipping PR creation');
              return;
            }

            // Check if PR already exists
            const existingPRs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branchName}`,
              base: baseBranch,
              state: 'open'
            });

            if (existingPRs.data.length > 0) {
              console.log(`PR already exists: ${existingPRs.data[0].html_url}`);
              return;
            }

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'docs: regenerate protobuf documentation',
              head: branchName,
              base: baseBranch,
              body: 'Automatically generated documentation update from protobuf changes.',
              draft: false
            });

            console.log(`Created PR: ${pr.data.html_url}`);

